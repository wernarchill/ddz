# 云端构建 APK —— 本机不需要装 JDK / Android SDK / Gradle
#
# 用法：
#   1) 把本工程推到 GitHub（新建一个仓库，把整个文件夹推上去即可）
#   2) 打开仓库页面 → Actions 标签 → 左侧选 "Build APK" → 右侧 "Run workflow" 按钮
#   3) 等 3~6 分钟，构建完成后在本次运行页面底部的 "Artifacts" 里下载 ddz-apk.zip
#   4) 解压得到 app-debug.apk / app-release.apk，拷到手机点击安装
#
# 每次 push 到 main/master 也会自动触发一次构建。
#
# 为什么用 `gradle` 而不是 `./gradlew`：本工程没有提交 gradle-wrapper.jar（二进制文件），
# setup-gradle 会自动安装指定版本的 Gradle，正好绕开这个问题。

name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK 命令行工具
        uses: android-actions/setup-android@v3

      - name: 安装所需的 SDK 组件
        run: |
          # 先接受许可（部分镜像上 sdkmanager 会因为没有 licences 而拒绝安装）
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 写入 local.properties（指向 CI 上的 SDK）
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 运行规则引擎自测（纯 JVM，不需要模拟器）
        # 自测失败不阻断出包，但会在日志里留下记录，方便定位规则问题
        continue-on-error: true
        run: gradle :app:rulesSelfTest --no-daemon --stacktrace

      - name: 构建 Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 构建 Release APK（用 debug 签名，可直接安装）
        # release 步骤失败也不影响已产出的 debug 包
        continue-on-error: true
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddz-apk
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/**/*.apk
